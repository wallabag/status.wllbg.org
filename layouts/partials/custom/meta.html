<link rel="icon" type="image/png" href="{{ "img/wallabag-icon.png" | relURL }}">
<link rel="apple-touch-icon" href="{{ "img/wallabag-icon.png" | relURL }}">
<style>
  /* Same look as the wallabag.it emails: grey page, white cards, mint accent */
  :root {
    --page: #f3f4f6;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #c0e0de;
    --hover: #f9fafb;
    --button: rgba(255, 255, 255, 0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111827;
      --card: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --line: #374151;
      --accent: #2f5552;
      --hover: #273244;
    --button: rgba(255, 255, 255, 0.1);
    }
  }

  html, body {
    background: var(--page);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  h1, h2, h3, h4, .bold, .component { color: var(--text); }
  h2 { font-weight: bold; font-size: 22px; letter-spacing: 0; }
  a { color: var(--text); border-bottom: 1px solid var(--accent); }
  .faded, .hinted, .date { color: var(--muted); opacity: 1; }
  hr { border-bottom-color: var(--line); }

  .contain { max-width: 680px; margin: 0 auto; padding: 12px 16px; }
  .contain--more { max-width: 680px; }

  /* Header */
  .header { background: transparent; padding: 24px 0 4px; }
  .header .contain { padding-top: 0; padding-bottom: 0; }
  .header a.header__logo {
    display: inline-flex; align-items: center; gap: 10px;
    border: 0; color: var(--text);
    font-size: 20px; font-weight: bold; font-variant: normal;
  }
  .header__logo img { width: 36px; height: 36px; border-radius: 8px; }

  /* Global status banner */
  .summary { border-radius: 8px; box-shadow: none !important; padding: 20px 24px; }
  .status-ok .summary { background: var(--accent); color: var(--text); }
  .status-ok .summary__date, .status-ok .summary .summary__date:hover:after { color: var(--text); }
  .status-ok .subscribe-button {
    color: var(--text); background: var(--button); border-color: var(--line);
  }

  /* Cards */
  .announcement-box, .components, .helpdesk, body.single > .contain:nth-of-type(2) {
    background: var(--card);
    border-radius: 8px;
  }
  .announcement-box { margin-top: 16px; border: 2px solid var(--line) !important; }
  .announcement-box p:first-child a { border: 0; }
  hr.announcement-box { display: none; }
  .categories .category { margin-top: 16px; }
  .categories .category:not(.category--titled) { margin-top: 0; }
  .category__head { margin-top: 0; padding: 12px 4px; border-radius: 8px; color: var(--muted); }
  .category__head:hover, .issue:hover { background: var(--hover); }
  .components { border: 0; overflow: hidden; }
  .component { border-bottom: 1px solid var(--line); padding: 14px 20px; }
  .component:last-child { border-bottom: 0; }
  .tag { background: var(--page); color: var(--text); }
  .tag:hover { background: var(--line); }

  .helpdesk {
    margin-top: 16px; padding: 20px 24px;
    border-left: 4px solid var(--accent);
  }
  .helpdesk strong { display: block; margin-bottom: 4px; }

  /* Incident history */
  .tabs { border: 0; }
  #incidents { padding-top: 0; }
  #incidents .issue { border-bottom: 1px solid var(--line); border-radius: 0; }
  .archive__head { background: transparent; color: var(--muted); padding: 16px 0 8px; }
  /* Incident page */
  body.single > .contain:first-of-type { padding-top: 24px; }
  body.single > .contain:nth-of-type(2) { padding: 28px; }
  body.single h1 { font-size: 30px; font-weight: bold; letter-spacing: 0; line-height: 1.2; margin-top: 0; }

  /* Footer */
  .footer { background: transparent; color: var(--muted); font-size: 14px; text-align: center; }
  .footer a { color: var(--muted); }
</style>
